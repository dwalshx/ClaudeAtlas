name: Daily Scrape & Deploy

on:
  schedule:
    - cron: '30 6 * * *' # 6:30 AM UTC daily
  workflow_dispatch:
    inputs:
      force_reembed:
        description: 'Force a full skill re-embed (one-time bootstrap of skill-vectors cache)'
        type: boolean
        default: false
      validate_ann:
        description: 'Run the one-shot HNSW-vs-exact recall validation (adds ~60-100 min; needs warm skill-vectors cache)'
        type: boolean
        default: false
      data_feeds:
        description: 'Phase 4.2: run the api harvest/filter/embed/enrich/upload legs this run (branch measurement; main stays off until the flip)'
        type: boolean
        default: false
  push:
    branches: [main]

# One data run at a time (2026-11-13). A manual recovery dispatch at 14:37 UTC
# and the scheduled run 13 min later embedded the same corpus in parallel,
# shared one GitHub user rate-limit bucket and one OpenAI quota, and BOTH hit
# the 6-hour job cap. schedule + workflow_dispatch now queue behind each other
# (never cancel — a cancelled data run loses its day's work). Push-event runs
# (~20-min redeploys from skills-latest) get their own group so a push can
# never replace a queued data run (GitHub keeps one pending run per group);
# a newer push supersedes an older in-flight push.
concurrency:
  group: daily-scrape-${{ github.event_name == 'push' && 'push' || 'data' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    # Required for the "Commit skills data" step to push back to main.
    # GitHub's default GITHUB_TOKEN scope is read-only since ~2023; the bot
    # needs explicit `contents: write` to push the daily data snapshot.
    permissions:
      contents: write
      # quick-260804-dy2 (FIX B): gh CLI in the notify-on-failure job needs
      # issues:write to open/comment the deduped cron-failure issue via
      # GITHUB_TOKEN. Added here too so the whole workflow's default token
      # scope is consistent; contents:write is UNCHANGED (data commit-back).
      issues: write
    # Daily target: <30 min warm. 90-min cap is safety net; if hit,
    # something is wrong. Phase 3.0.1 architecture: Track 1 (Star Pulse,
    # cheap refresh of known repos) → Track 2 (Discovery via repo search,
    # incremental — only new/changed skills, fed by GHA-cached
    # data/skills-raw.ndjson) → Filter (writes data/skills.ndjson). T5
    # (2026-05-25): skills.ndjson is distributed via the `skills-latest`
    # GitHub release asset, NOT committed to main; per-slug records also
    # publish to Workers KV (SKILLS_KV) for the Listed-tier dynamic render
    # path in worker/index.js.
    # Push-triggered runs skip scrape/filter/embed/upload/publish entirely
    # and just fetch `skills-latest` from the release asset, then build
    # and deploy.
    # T7 (2026-05-25): timeout bumped 90 → 300 to give post-T5 first-run
    # headroom. Steady-state runs still complete in ~15-30 min; the
    # 300-min cap is a safety net for the initial KV bootstrap (~10k
    # records on first publish) + any cold-cache scenarios. Cherry-picked
    # from archive commit 5b04b87. Still under GitHub's 6h platform cap.
    #
    # Phase 3.2 Task 13 (3.2-DOD-12): bumped 300 → 330. The 2026-05-30
    # 09:00 UTC schedule hit the 300-min ceiling (5h0m18s) BEFORE the
    # plugin/MCP steps were added. Measured pre-3.2 full-run mean is
    # ~244 min (Build Astro alone is ~94 min — the O(n²) compute-similar
    # scan dominates, NOT embed/enrich). Adding ~48 min of plugin/MCP work
    # projects to ~293 min post-mitigation — under the 320-min B-3 gate
    # with a 37-min margin. See 3.2-CRON-AUDIT.md for the full projection
    # table and the verified finding that compute-similar TOP_K reduction
    # saves ~0 compute (so Option D / this bump is the operative
    # mitigation). GHA platform cap is 6h/360 min.
    # quick-260603-e96 (2026-06-07): bumped 330 → 360 (GHA platform max). At
    # ~50k records the warm full run (Track1+2 ~25m, incremental embed ~5m,
    # enrich ~59m, build >162m) needs more runway than 330 once the catalog
    # grew. 360 is the LAST stopgap — the durable fix is the HNSW/Vectorize
    # optimization for compute-similar (build) + enrich dedup, both O(n²) at 50k.
    timeout-minutes: 360
    # Phase 3.4 (2026-06-15): plugin/MCP pipeline RE-ENABLED. The pre-3.4 full
    # ecosystem sweep never finished inside the timeout (3.3-07 measurement:
    # ~1,700/7,300 repos in 5.5h → ~24h full sweep), so PLUGINS_ENABLED was
    # gated 'false'. Phase 3.4 made discovery incremental:
    #   A — scrape-plugins.js seeds processedSet from the cached OUTPUT corpus
    #       (the .partial-vs-OUTPUT wiring bug fix) → warm runs skip known repos.
    #   B — GraphQL batch engagement-refresh of known repos (separate 5k-pts/hr
    #       budget), so skipping their REST walk doesn't freeze stars/metadata.
    #   C — pushed_at re-walk gate + single recursive git/trees walk → only
    #       CHANGED repos re-walk; the weekly FULL re-walk lives in its own
    #       workflow (.github/workflows/weekly-plugin-rewalk.yml, own 360-min
    #       budget) so the DAILY cron is steady-state only.
    # Branch measurements (3.4-04-MEASUREMENT): cold-cache worst case ~324 min
    # (< 360 cap); steady-state (stamped cache) ~90 min. Re-enabled after the
    # measure-before-flip gate passed. Seed the stamped cache once via the
    # weekly workflow so the first daily run is already steady-state.
    # REVERSIBLE: set PLUGINS_ENABLED='false' to gate the plugin/MCP pipeline
    # back off. The gated steps AND-combine this flag; the skill side is untouched.
    env:
      PLUGINS_ENABLED: 'true'
      # Phase 4.2 (v4.0 Data Feeds — docs/PHASE-4.0-SPEC.md): api pipeline flag. Resolves to 'false'
      # on schedule/push and when the dispatch input is unset/false, so main is unchanged; dispatch
      # with data_feeds=true to exercise the gated api steps on a branch. The flip (literal 'true'
      # fallback) happens only after a green measured run — see
      # .planning/phases/4.2-api-harvest-v1/4.2-MEASUREMENT.md.
      DATA_FEEDS_ENABLED: ${{ inputs.data_feeds || 'false' }}
      # 2026-11-14: Track 2 died with "Reached heap limit … JavaScript heap out of
      # memory" (run 43536499914) once the raw corpus reached ~144k records — it
      # holds the whole corpus Map plus the ETag cache in memory, and Node's default
      # old-space cap on the runner is ~4 GB. ubuntu-latest has 16 GB RAM and the
      # steps run one node process at a time, so give every step 12 GB of heap.
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Outage 2026-09-28 → 11-05 (.planning/debug/daily-scrape-outage-
      # 2026-09-28.md): the fine-grained SCRAPE_PAT expired on 2026-10-14 and
      # every scraper read the resulting 401 as a quiet day. Probe BOTH PATs
      # before spending a single API call or cache restore: fail in seconds
      # with the runbook if either is dead, ::warning:: when <14 days remain.
      # Logs status + expiration header only, never token material.
      - name: "Preflight: verify GitHub tokens"
        if: github.event_name != 'push'
        env:
          SCRAPE_PAT: ${{ secrets.SCRAPE_PAT }}
          SCRAPE_PAT_CLASSIC: ${{ secrets.SCRAPE_PAT_CLASSIC }}
          TOKEN_WARN_DAYS: '14'
        run: node scripts/check-github-tokens.js

      # --- Data pipeline (scheduled + manual runs only) ---
      # Push events skip the scrape+filter+cache+publish steps and just
      # fetch skills.ndjson from the `skills-latest` release asset
      # (Rev 2 F1 fallback to `skills-latest-prev` if missing). This makes
      # code deploys fast (~2 min including the asset download) and avoids
      # the cold-scrape timeout problem on first runs without an ETag cache.

      # Restore ETag cache from previous run.
      # Split from save step so that save can run with `if: always()`
      # after the scrape — even if the scrape times out or is cancelled,
      # the partially-built cache (scraper checkpoints every 1000 skills
      # via saveETagCache()) gets persisted for the next run.
      - name: Restore ETag cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: data/etag-cache.json
          key: etag-cache-${{ github.run_number }}
          restore-keys: etag-cache-

      # Restore skills-raw cache from previous run. Mirrors the ETag
      # cache pattern (split restore/save so save can run with
      # `if: always()`). skills-raw.ndjson is gitignored and cannot live
      # in the repo, so the GHA cache is its only home between runs.
      # Without it, Track 2's incremental skip-known-IDs logic has no
      # input and re-parses the entire corpus each run.
      #
      # T4 (2026-05-25): cache key prefix changed from `skills-raw-` to
      # `skills-raw-ndjson-` because the file format changed from
      # JSON-array to NDJSON. First post-T4 cron run misses the cache and
      # falls back to the `skills-raw-ndjson-bootstrap` release asset (or
      # filter.js's graceful Track-1-only fallback if the bootstrap
      # workflow hasn't run yet).
      - name: Restore skills-raw cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: data/skills-raw.ndjson
          key: skills-raw-ndjson-${{ github.run_number }}
          restore-keys: skills-raw-ndjson-

      # T5 5e follow-up: Track 1 reads data/skills.ndjson to know which
      # repos to refresh. Post-T5, skills.ndjson is gitignored and
      # distributed via the skills-latest release asset, so the runner
      # needs to fetch it before Track 1 runs. On the FIRST post-T5 run
      # the asset doesn't exist yet — that's OK; Track 1 skips (its
      # output is an enrichment overlay, not a hard dependency). Filter
      # then bootstraps a fresh skills.ndjson from Track 2's output.
      - name: Fetch prior skills-latest release asset (for Track 1 input)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download skills-latest --pattern 'skills.ndjson' --output data/skills.ndjson 2>/dev/null; then
            echo "Fetched prior skills-latest for Track 1 freshness merge ($(wc -l < data/skills.ndjson) records)"
          else
            echo "No prior skills-latest release asset (first post-T5 run?). Track 1 will skip; filter bootstraps from Track 2 output."
          fi

      # Track 1: Star Pulse — cheap refresh of stars/forks/issues/pushed_at
      # for already-known repos. Conditional GETs via ETag cache make this
      # near-free for unchanged repos.
      #
      # `if: hashFiles(...)` skips Track 1 cleanly on the first-ever post-T5
      # run when skills.ndjson hasn't been bootstrapped yet. Track 1's job
      # is to refresh existing records, not produce new ones; missing it
      # for one day is acceptable (next run picks up where this left off
      # with the new skills-latest).
      - name: Run Track 1 (Star Pulse)
        if: github.event_name != 'push' && hashFiles('data/skills.ndjson') != ''
        run: npm run scrape:pulse
        env:
          # Track 1 uses GraphQL → needs a CLASSIC PAT (fine-grained SCRAPE_PAT
          # is 403'd by the GraphQL API). GraphQL's separate 5,000-pts/hr budget
          # also frees the REST budget for Track 2 + plugin discovery.
          GITHUB_TOKEN: ${{ secrets.SCRAPE_PAT_CLASSIC }}

      # Track 2: Discovery via repo search — incremental SKILL.md discovery.
      # Reads cached data/skills-raw.ndjson (restored above), skips known IDs,
      # appends new/changed skills, writes back to data/skills-raw.ndjson for
      # the Save skills-raw cache step below.
      - name: Run Track 2 (Discovery via repo search)
        if: github.event_name != 'push'
        run: npm run scrape:discover
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPE_PAT }}

      # Outage 2026-10-18: the weekly workflow persisted a 0-record
      # skills-raw.ndjson under the NEWEST `skills-raw-ndjson-*` key, and the
      # restore-keys prefix match above served that placeholder to every daily
      # run for 18 days. Never persist a corpus under 1,000 lines — emit
      # save=false so the step below is skipped and the last good key stays
      # the newest. (`wc -l` streams; no JSON.parse of data/ in YAML — F1 B4.)
      - name: "Guard: never persist an empty skills-raw corpus"
        id: skills-raw-guard
        if: always() && github.event_name != 'push'
        run: |
          SAVE=false
          if [ -f data/skills-raw.ndjson ]; then
            LINES=$(wc -l < data/skills-raw.ndjson)
            if [ "$LINES" -ge 1000 ]; then
              SAVE=true
              echo "skills-raw.ndjson: $LINES lines — OK to cache"
            else
              echo "::warning::data/skills-raw.ndjson has only $LINES lines — NOT saving it to the GHA cache (placeholder/empty corpus). See CLAUDE.md 'Recovery: expired GitHub PAT / poisoned GHA caches'."
            fi
          else
            echo "data/skills-raw.ndjson absent — nothing to cache"
          fi
          echo "save=$SAVE" >> "$GITHUB_OUTPUT"

      # Save skills-raw cache even on timeout/failure/cancel, matching the
      # ETag cache `if: always()` pattern. Track 2 checkpoints incrementally,
      # so a partial corpus is still valuable for the next run.
      - name: Save skills-raw cache
        if: always() && github.event_name != 'push' && steps.skills-raw-guard.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/skills-raw.ndjson
          key: skills-raw-ndjson-${{ github.run_number }}

      # Save ETag cache even on timeout/failure/cancel. This is the
      # critical fix: actions/cache@v4's implicit post-job save is
      # skipped when the job is cancelled (e.g. timeout), which caused
      # every scheduled run to be a cold scrape. With `if: always()`
      # and a bounded condition, the cache persists regardless of the
      # scrape step's outcome so subsequent runs start warm.
      - name: Save ETag cache
        if: always() && github.event_name != 'push' && hashFiles('data/etag-cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/etag-cache.json
          key: etag-cache-${{ github.run_number }}

      # Phase 3.2 (Task 12, D-11): restore the plugins-raw discovery cache
      # before the plugin scrape. Mirrors the skills-raw GHA-cache pattern:
      # scrape-plugins.js checkpoints incrementally to data/plugins-raw.ndjson
      # (+ .partial), so a warm cache makes the daily plugin pass cheap.
      - name: Restore plugins-raw cache
        # quick-260603-e96: plugin/MCP pipeline gated OFF (see job env above).
        if: ${{ env.PLUGINS_ENABLED == 'true' && github.event_name != 'push' }}
        uses: actions/cache/restore@v4
        with:
          path: data/plugins-raw.ndjson
          key: plugins-raw-ndjson-${{ github.run_number }}
          restore-keys: |
            plugins-raw-ndjson-

      # Phase 3.2 (Task 12): NEW — Scrape plugins (~30 min). Discovers
      # .claude-plugin/marketplace.json + plugin.json across GitHub, writes
      # data/plugins-raw.ndjson. Cron/manual only (push events skip scrape).
      - name: Run plugin discovery (scrape-plugins)
        # quick-260603-e96: plugin/MCP pipeline gated OFF (see job env above).
        # This step is the timeout culprit — full-ecosystem sweep at 5k REST/hr.
        # 2026-11-12: after the 6-week outage the re-walk backlog ran this step
        # past the job's 360-min limit, so build/deploy never ran. The step now has
        # its own 90-min budget and is non-fatal: scrape-plugins checkpoints into
        # data/plugins-raw.ndjson and the always() cache save below keeps that
        # progress, so a backlog drains over several days while the skills build,
        # deploy and history commit still happen every day. Steady state today is
        # ~11 min discovery + ~60 min GraphQL refresh (29.6k known repos) + re-walks.
        if: ${{ env.PLUGINS_ENABLED == 'true' && github.event_name != 'push' }}
        timeout-minutes: 90
        continue-on-error: true
        run: node scripts/scrape-plugins.js
        env:
          # REST discovery/walk uses the fine-grained SCRAPE_PAT (GITHUB_TOKEN).
          GITHUB_TOKEN: ${{ secrets.SCRAPE_PAT }}
          # Phase 3.4 / Change B: the in-process GraphQL engagement-refresh
          # (refreshKnownRepos) needs a CLASSIC PAT — fine-grained SCRAPE_PAT is
          # 403'd by GitHub's GraphQL API (same constraint as scrape-pulse.js's
          # Track 1). refreshKnownRepos swaps GITHUB_TOKEN to this for the GraphQL
          # batch loop only, then restores the REST PAT. Single process, no second
          # cache restore — the refresh operates on the same in-memory corpus.
          SCRAPE_PAT_CLASSIC: ${{ secrets.SCRAPE_PAT_CLASSIC }}

      # Save plugins-raw cache even on timeout/failure/cancel (mirrors the
      # skills-raw `if: always()` pattern). Partial corpus stays useful.
      - name: Save plugins-raw cache
        # quick-260603-e96: plugin/MCP pipeline gated OFF (see job env above).
        if: ${{ always() && env.PLUGINS_ENABLED == 'true' && github.event_name != 'push' && hashFiles('data/plugins-raw.ndjson') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/plugins-raw.ndjson
          key: plugins-raw-ndjson-${{ github.run_number }}

      # Filter: reads data/skills-raw.json (now persisted via GHA cache),
      # applies slop removal / dedup / per-repo cap / tier recalibration,
      # writes data/skills.json for build/deploy.
      - name: Filter and calibrate skills
        if: github.event_name != 'push'
        run: npm run filter

      # Phase 3.2 (Task 12): NEW — Filter plugins. Reads data/plugins-raw.ndjson,
      # scores via the plugin scorer registry, writes data/plugins.ndjson +
      # appends a plugin section to data/pipeline-stats.json (allowlisted sidecar
      # — no F1 banned-pattern delta).
      - name: Filter plugins
        # quick-260603-e96: plugin/MCP pipeline gated OFF (see job env above).
        if: ${{ env.PLUGINS_ENABLED == 'true' && github.event_name != 'push' }}
        run: node scripts/filter-plugins.js

      # Phase 3.2 (Task 12): NEW — Filter MCP servers. Reads MCP discovery
      # (mcp-servers-raw / registry), writes data/mcp-servers.ndjson + appends an
      # mcp_server section to data/pipeline-stats.json (allowlisted sidecar).
      - name: Filter MCP servers
        # quick-260603-e96: plugin/MCP pipeline gated OFF (see job env above).
        if: ${{ env.PLUGINS_ENABLED == 'true' && github.event_name != 'push' }}
        run: node scripts/filter-mcps.js

      # Phase 3.2 (Task 12, D-02): NEW — Link bundles. Builds the bidirectional
      # bundle graph (plugin.extra.bundled_skills[] <-> skill.bundled_in_plugins[])
      # and rewrites data/skills.ndjson + data/plugins.ndjson atomically via
      # writeNdjsonStreaming. NDJSON-only writes — no F1 banned-pattern delta.
      # Graceful exit-0 if data/plugins.ndjson is absent.
      - name: Link bundles (skill <-> plugin graph)
        # quick-260603-e96: plugin/MCP pipeline gated OFF (see job env above).
        if: ${{ env.PLUGINS_ENABLED == 'true' && github.event_name != 'push' }}
        run: node scripts/link-bundles.js

      # Phase 4.2 (D-07): api harvest. Restores the raw corpus + the feeds ETag sidecar
      # (actions/cache multi-line path), runs the four-source harvester (no GitHub token:
      # raw.githubusercontent.com is unauthenticated; apis.guru / data.gouv.fr are public),
      # saves the cache even on failure so a partial corpus survives.
      # FAILURE ISOLATION (PR #26): every api step is `continue-on-error: true` so an api
      # failure never blocks the skill build/deploy/commit. Each downstream api step requires
      # the upstream step's `outcome == 'success'` (outcome is the real result even with
      # continue-on-error) AND its input file, so a failed harvest/filter never filters,
      # embeds or publishes stale/empty data. No skill-side step references these step ids.
      - name: Restore apis-raw cache
        if: ${{ env.DATA_FEEDS_ENABLED == 'true' && github.event_name != 'push' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            data/apis-raw.ndjson
            data/feeds-etag-cache.ndjson
          key: apis-raw-ndjson-${{ github.run_number }}
          restore-keys: |
            apis-raw-ndjson-

      - name: Run API harvest (harvest-apis)
        id: harvest_apis
        if: ${{ env.DATA_FEEDS_ENABLED == 'true' && github.event_name != 'push' }}
        continue-on-error: true
        run: node scripts/harvest-apis.js

      - name: Save apis-raw cache
        if: ${{ always() && env.DATA_FEEDS_ENABLED == 'true' && github.event_name != 'push' && hashFiles('data/apis-raw.ndjson') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/apis-raw.ndjson
            data/feeds-etag-cache.ndjson
          key: apis-raw-ndjson-${{ github.run_number }}

      # Phase 4.2 (D-05): merge + score + tier api records → data/apis.ndjson; appends an `api`
      # section to data/pipeline-stats.json (allowlisted sidecar). Fails loudly below 1,000 raw.
      # Runs only on a successful harvest: the restored cache would otherwise feed yesterday's raw.
      - name: Filter APIs
        id: filter_apis
        if: ${{ env.DATA_FEEDS_ENABLED == 'true' && github.event_name != 'push' && steps.harvest_apis.outcome == 'success' && hashFiles('data/apis-raw.ndjson') != '' }}
        continue-on-error: true
        run: node scripts/filter-apis.js

      # --- Semantic search: embed new/changed skills, upload to Vectorize ---
      # Embed step is resumable and idempotent: reads prior ndjson, only embeds
      # deltas. Safe to run on every workflow event. Upload step upserts into
      # the Vectorize index; matching ids are replaced.

      # Restore skill-vectors cache from previous run. Mirrors the skills-raw
      # cache pattern (split restore/save so save can run with `if: always()`).
      # WITHOUT this, every run starts from the committed stale 1,078-vector
      # Phase-1 seed against ~50k current skills — the embed's incremental
      # delta-check sees a ~2% cache hit and embed-skills.js's drift guard
      # correctly aborts rather than brute-force re-embedding 50k records
      # (~$0.40/run, over the cost ceiling). The GHA cache carries the
      # incrementally-grown skill-vectors.ndjson between runs so the embed
      # stays a true delta. Cold-start: falls back to restore-keys' most
      # recent prior cache, then to the committed seed (one-time bootstrap
      # via the force_reembed dispatch input below).
      - name: Restore skill-vectors cache
        id: restore-skill-vectors
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: data/skill-vectors.ndjson
          key: skill-vectors-${{ github.run_number }}
          restore-keys: skill-vectors-

      - name: Embed skills (OpenAI)
        if: github.event_name != 'push'
        run: npm run embed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # One-time bootstrap: dispatch the workflow with force_reembed=true to
          # rebuild skill-vectors.ndjson from scratch (and seed the GHA cache).
          # workflow_dispatch boolean inputs arrive as the STRING 'true'/'false'.
          EMBED_FORCE_REEMBED: ${{ github.event.inputs.force_reembed == 'true' && '1' || '0' }}

      # Outage 2026-09-28: Track 1 failed BEFORE the restore step above ran,
      # so data/skill-vectors.ndjson on disk was the COMMITTED 1,078-vector
      # Phase-1 seed — and this always() save persisted it as the newest
      # `skill-vectors-*` key. Every later run restored the seed, the embed
      # drift guard (correctly) refused to re-embed 103k records, and the
      # save re-persisted the seed: 19 days of "Embed skills" failures.
      # Two guards: (a) only save when the restore step actually ran
      # (`outcome == 'success'`; a skipped restore means an earlier failure);
      # (b) never save a file byte-identical to the committed seed.
      - name: "Guard: never persist the committed skill-vectors seed"
        id: skill-vectors-guard
        if: always() && github.event_name != 'push'
        run: |
          SAVE=false
          if [ -f data/skill-vectors.ndjson ]; then
            if git diff --quiet -- data/skill-vectors.ndjson; then
              echo "::warning::data/skill-vectors.ndjson is byte-identical to the committed 1,078-vector seed — NOT saving it to the GHA cache. Dispatch with force_reembed=true to rebuild the real vector cache."
            else
              SAVE=true
              echo "skill-vectors.ndjson: $(wc -l < data/skill-vectors.ndjson) vectors — OK to cache"
            fi
          fi
          echo "save=$SAVE" >> "$GITHUB_OUTPUT"

      # Save skill-vectors cache even on timeout/failure/cancel, mirroring the
      # skills-raw `if: always()` pattern. The embed grows the vector file
      # incrementally; persisting it (even partially) keeps the next run warm
      # so the drift guard never re-trips on a cold seed.
      - name: Save skill-vectors cache
        if: always() && github.event_name != 'push' && steps.restore-skill-vectors.outcome == 'success' && steps.skill-vectors-guard.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/skill-vectors.ndjson
          key: skill-vectors-${{ github.run_number }}

      # Phase 3.2.1: one-shot real-vector recall validation (CI-only — the real
      # ~51k vector file lives only in the GHA cache; local copies are the stale
      # 1,078-vector Phase-1 seed). Dispatch with -f validate_ann=true. ~60-100 min.
      # Placed right after the embed/save (vectors are freshest here) and BEFORE
      # enrich, so a FAIL stops the run before bad dedup data could publish.
      - name: Validate ANN recall vs exact baseline (dispatch-gated)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.validate_ann == 'true'
        run: node scripts/validate-ann-recall.js

      # Phase 3.2 (Task 12): NEW — Embed plugins. Same OpenAI embedder, dispatched
      # by --entity-type. Reads data/plugins.ndjson, writes data/plugin-vectors.ndjson;
      # resumable + idempotent via the per-record _content_sha delta check.
      - name: Embed plugins (OpenAI)
        # quick-260603-e96: plugin/MCP pipeline gated OFF (see job env above).
        if: ${{ env.PLUGINS_ENABLED == 'true' && github.event_name != 'push' }}
        run: node scripts/embed-skills.js --entity-type plugin
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Phase 3.2 (Task 12): NEW — Embed MCP servers. Reads data/mcp-servers.ndjson,
      # writes data/mcp-vectors.ndjson. metadata.entity_type=mcp_server lets the
      # worker ?type= filter resolve MCP results.
      - name: Embed MCP servers (OpenAI)
        # quick-260603-e96: plugin/MCP pipeline gated OFF (see job env above).
        if: ${{ env.PLUGINS_ENABLED == 'true' && github.event_name != 'push' }}
        run: node scripts/embed-skills.js --entity-type mcp_server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Phase 4.2 (D-07): Embed APIs. Reads data/apis.ndjson, writes data/api-vectors.ndjson
      # (metadata.entity_type=api → /api/v1/search?type=api). Unlike plugin vectors, the api
      # vector file is GHA-cached (restore/save split like skill-vectors) so runs stay deltas.
      - name: Restore api-vectors cache
        if: ${{ env.DATA_FEEDS_ENABLED == 'true' && github.event_name != 'push' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: data/api-vectors.ndjson
          key: api-vectors-${{ github.run_number }}
          restore-keys: api-vectors-

      - name: Embed APIs (OpenAI)
        id: embed_apis
        if: ${{ env.DATA_FEEDS_ENABLED == 'true' && github.event_name != 'push' && steps.filter_apis.outcome == 'success' && hashFiles('data/apis.ndjson') != '' }}
        continue-on-error: true
        run: node scripts/embed-skills.js --entity-type api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Save api-vectors cache
        if: ${{ always() && env.DATA_FEEDS_ENABLED == 'true' && github.event_name != 'push' && hashFiles('data/api-vectors.ndjson') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/api-vectors.ndjson
          key: api-vectors-${{ github.run_number }}

      # Phase 3.1: post-embed enrichment. Reads skills.ndjson + the freshly
      # updated skill-vectors.ndjson via the chunked NDJSON helper, computes
      # pairwise cosine to set is_duplicate / canonical_slug / novelty_score,
      # rewrites skills.ndjson atomically. Runs locally — does NOT call
      # Vectorize (the local NDJSON is the source of truth for build-time
      # computations; the $12/yr cost ceiling means we don't pay Vectorize
      # per-query for novelty).
      - name: Enrich skills (dedup + novelty)
        if: github.event_name != 'push'
        # Phase 3.2.1: pipefail BEFORE the pipe — GitHub's default step shell is
        # `bash -e {0}` WITHOUT pipefail, so `npm run enrich | tee` would
        # otherwise mask an enrich failure behind tee's exit 0.
        run: |
          set -o pipefail
          npm run enrich 2>&1 | tee /tmp/enrich.log

      # Phase 3.2.1: anti-silent-fallback + timing gate. If the native hnswlib
      # build ever breaks on a runner/Node bump, ann.js falls back to the exact
      # engine and the cron quietly creeps back toward the 221-min O(N²) path —
      # this gate makes that failure LOUD instead (RESEARCH.md Pitfall 2).
      - name: "Gate: ANN engine + enrich timing"
        if: github.event_name != 'push'
        run: |
          grep -q '\[ann\] engine=hnsw' /tmp/enrich.log || { echo '::error::ANN engine gate FAILED — enrich ran on the exact fallback engine (silent O(N²) regression). Check hnswlib-node compile in npm ci.'; exit 1; }
          ELAPSED=$(grep -o 'enrichment complete in [0-9.]*s' /tmp/enrich.log | grep -o '[0-9.]*' | head -1)
          [ -n "$ELAPSED" ] || { echo '::error::enrich timing gate FAILED — could not parse elapsed seconds from /tmp/enrich.log (log-line contract broken?)'; exit 1; }
          echo "enrich elapsed: ${ELAPSED}s (gate: <900)"
          awk -v e="$ELAPSED" 'BEGIN { exit (e+0 < 900) ? 0 : 1 }' || { echo "::error::enrich timing gate FAILED: ${ELAPSED}s >= 900s (15 min) — engine fallback or regression"; exit 1; }

      # Phase 3.2 (Task 12, D-10): NEW — Enrich plugins (dedup + novelty).
      # Reads data/plugin-vectors.ndjson + data/plugins.ndjson, rewrites
      # data/plugins.ndjson with is_duplicate / canonical_id / novelty_score.
      # MCP servers are intentionally NOT enriched — the MCP corpus is below
      # the dedup threshold (enrich.js early-returns for entity_type=mcp_server).
      - name: Enrich plugins (dedup + novelty)
        # quick-260603-e96: plugin/MCP pipeline gated OFF (see job env above).
        if: ${{ env.PLUGINS_ENABLED == 'true' && github.event_name != 'push' }}
        run: node scripts/enrich.js --input data/plugin-vectors.ndjson --records data/plugins.ndjson --entity-type plugin

      # Phase 4.2: api IS enriched (D-03: embedding dedup catches same-API-different-host);
      # mcp_server remains the only skipped type.
      - name: Enrich APIs (dedup + novelty)
        if: ${{ env.DATA_FEEDS_ENABLED == 'true' && github.event_name != 'push' && steps.embed_apis.outcome == 'success' && hashFiles('data/apis.ndjson') != '' }}
        continue-on-error: true
        run: node scripts/enrich.js --input data/api-vectors.ndjson --records data/apis.ndjson --entity-type api

      # quick-260804-d5p: versioned catalog composition snapshot. Runs AFTER
      # enrichment (so is_duplicate / quality_tier are fresh) and BEFORE the
      # Astro build. Writes one small committed file per day at
      # data/snapshots/<today>.json (tier / entity-type / category counts) —
      # the compounding substrate for the future /trends page + AEO trend
      # consumers. Reads the catalog NDJSON via the chunked helper; missing
      # plugin/MCP inputs contribute zero. Gated like enrich (skipped on
      # push-event rebuilds, which don't re-enrich). The file is committed by
      # the main-only "Commit skills data" step below.
      - name: Snapshot catalog composition
        if: github.event_name != 'push'
        run: node scripts/snapshot-catalog.js

      # quick-260818-ohb: daily traffic-analytics snapshot. Read-only rollup of
      # the D1 request_log table into data/traffic-snapshot.json (one small,
      # committed per-day time series). Runs after enrich alongside the catalog
      # snapshot; gated non-push like it. continue-on-error so a transient D1
      # blip never fails the run — the script itself already exits 0 on any
      # failure and leaves the existing file untouched. The file is committed by
      # the main-only "Commit skills data" step below.
      - name: Snapshot traffic analytics
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/snapshot-traffic.js
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # Phase 3.2 (Task 12): Upload vectors to Vectorize — extended to upsert all
      # three entity vector files (skills + plugins + MCPs). Each invocation logs
      # its metadata.entity_type distribution. Missing inputs are skipped gracefully
      # by upload-vectors.js. Main-only (writes to prod Vectorize index).
      - name: Upload vectors to Vectorize
        # Branch dispatch safety (Phase 3.1): writes to production Vectorize
        # index. Gated to main so branch dry-runs exercise embed locally
        # without touching prod search.
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          for f in data/skill-vectors.ndjson data/plugin-vectors.ndjson data/mcp-vectors.ndjson data/api-vectors.ndjson; do
            if [ -f "$f" ] && [ "$f" = data/api-vectors.ndjson ]; then
              # PR #26: the api upload is non-fatal — an api failure must never block the skills deploy.
              echo "Uploading vectors from $f (non-fatal)"
              node scripts/upload-vectors.js --input "$f" || echo "::warning::api vector upload failed (non-fatal; skills deploy continues)"
            elif [ -f "$f" ]; then
              echo "Uploading vectors from $f"
              node scripts/upload-vectors.js --input "$f"
            else
              echo "::notice::$f absent — skipping"
            fi
          done
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # T5 5e (Rev 2 F1): Tag previous skills-latest as skills-latest-prev
      # BEFORE clobbering. Preserves a one-day rollback target for
      # data-shape divergence cases. The push-event branch (below) falls
      # back to this prev tag if the current `skills-latest` is unreadable.
      - name: Tag previous skills-latest as skills-latest-prev
        # Branch dispatch safety (Phase 3.1): would consume the rollback
        # safety net by rotating prev. Main-only.
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view skills-latest >/dev/null 2>&1; then
            mkdir -p /tmp/prev-release
            gh release download skills-latest --pattern 'skills.ndjson' --output /tmp/prev-release/skills.ndjson
            gh release delete skills-latest-prev --yes 2>/dev/null || true
            gh release create skills-latest-prev /tmp/prev-release/skills.ndjson \
              --notes "Previous skills-latest, kept for F1 rollback. Auto-tagged $(date -u +%Y-%m-%dT%H:%M:%SZ)." \
              --prerelease
            echo "Tagged previous skills-latest as skills-latest-prev"
          else
            echo "First publish — no prior skills-latest to tag as prev"
          fi

      # T5 5e: Publish current skills.ndjson as `skills-latest` release asset.
      # Replaces the legacy "git add data/skills.json" commit-back path —
      # the file is too large to keep growing daily in the repo.
      - name: Publish skills-latest release asset
        # Branch dispatch safety (Phase 3.1): would clobber prod data shape.
        # Main-only.
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view skills-latest >/dev/null 2>&1; then
            gh release upload --clobber skills-latest data/skills.ndjson
          else
            gh release create skills-latest data/skills.ndjson \
              --notes "Daily skills NDJSON snapshot $(date -u +%Y-%m-%d)"
          fi
          echo "Published $(wc -l < data/skills.ndjson) records to skills-latest"

      # plugins-empty-deploy fix (B1): Publish current plugins.ndjson +
      # mcp-servers.ndjson as `plugins-latest` release assets — mirrors the
      # skills-latest publish above. WITHOUT this, push-event rebuilds had no
      # plugin/MCP data to fetch → built 0 plugin pages → clobbered live data
      # (the 2026-06-16 docs-commit regression that zeroed claudeatlas.com/plugins/).
      # Same main-only gate as skills-latest (a branch publish would clobber prod shape).
      - name: Publish plugins-latest release asset
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view plugins-latest >/dev/null 2>&1; then
            gh release upload --clobber plugins-latest data/plugins.ndjson data/mcp-servers.ndjson
          else
            gh release create plugins-latest data/plugins.ndjson data/mcp-servers.ndjson \
              --notes "Daily plugins + MCP NDJSON snapshot $(date -u +%Y-%m-%d)"
          fi
          echo "Published $(wc -l < data/plugins.ndjson) plugins and $(wc -l < data/mcp-servers.ndjson) MCP servers to plugins-latest"

      # Phase 4.2 (D-07): rotate apis-latest → apis-latest-prev (one-day rollback target),
      # mirroring the skills-latest-prev step. Main-only AND flag-gated.
      - name: Tag previous apis-latest as apis-latest-prev
        if: ${{ env.DATA_FEEDS_ENABLED == 'true' && github.event_name != 'push' && github.ref == 'refs/heads/main' && steps.filter_apis.outcome == 'success' && hashFiles('data/apis.ndjson') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view apis-latest >/dev/null 2>&1; then
            mkdir -p /tmp/prev-apis
            gh release download apis-latest --pattern 'apis.ndjson' --output /tmp/prev-apis/apis.ndjson
            gh release delete apis-latest-prev --yes 2>/dev/null || true
            gh release create apis-latest-prev /tmp/prev-apis/apis.ndjson \
              --notes "Previous apis-latest, kept for rollback. Auto-tagged $(date -u +%Y-%m-%dT%H:%M:%SZ)." \
              --prerelease
            echo "Tagged previous apis-latest as apis-latest-prev"
          else
            echo "First publish — no prior apis-latest to tag as prev"
          fi

      # Phase 4.2 (D-07): publish data/apis.ndjson as the `apis-latest` release asset so
      # push-event rebuilds (and 4.3 pages) have api data. Main-only AND flag-gated.
      - name: Publish apis-latest release asset
        if: ${{ env.DATA_FEEDS_ENABLED == 'true' && github.event_name != 'push' && github.ref == 'refs/heads/main' && steps.filter_apis.outcome == 'success' && hashFiles('data/apis.ndjson') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view apis-latest >/dev/null 2>&1; then
            gh release upload --clobber apis-latest data/apis.ndjson
          else
            gh release create apis-latest data/apis.ndjson \
              --notes "Daily API NDJSON snapshot $(date -u +%Y-%m-%d)"
          fi
          echo "Published $(wc -l < data/apis.ndjson) api records to apis-latest"

      # T5 5e (Decision A): Publish per-slug records to Workers KV for
      # the Listed-tier dynamic render path in worker/index.js. Streams
      # data/skills.ndjson, computes content_sha per record, upserts only
      # changed records via the bulk API. KV_PUBLISH_BUDGET caps writes
      # per run — free-tier safe at 1k/day.
      - name: Publish per-slug records to Workers KV
        # Branch dispatch safety (Phase 3.1): writes to production KV.
        # Main-only.
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SKILLS_KV_NAMESPACE_ID: ${{ secrets.SKILLS_KV_NAMESPACE_ID }}
          # Phase 3.1: 25000 covers the full Listed tier (~21k records) plus
          # ~3.5k headroom for future catalog growth. Requires Cloudflare
          # Workers Paid plan ($5/mo; 1M KV writes/day vs free-tier 1k/day).
          # Upgraded 2026-05-26 alongside Phase 3.1 ship — see PROJECT.md
          # "Constraints" + CLAUDE.md cost ceiling. If the upgrade is ever
          # rolled back, drop this to 1000 (publish-kv.js's internal cap
          # gracefully defers excess records to subsequent runs).
          KV_PUBLISH_BUDGET: '25000'
        run: npm run publish:kv

      # T5 5e: Push-event branch fetches skills.ndjson from the
      # `skills-latest` release asset (Rev 2 F1 fallback to
      # skills-latest-prev for data-shape divergence rollback).
      - name: Fetch skills-latest release asset (push-event path)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          if gh release download skills-latest --pattern 'skills.ndjson' --output data/skills.ndjson 2>/dev/null; then
            echo "Fetched skills.ndjson from skills-latest ($(wc -l < data/skills.ndjson) records)"
          elif gh release download skills-latest-prev --pattern 'skills.ndjson' --output data/skills.ndjson 2>/dev/null; then
            echo "::warning::Fetched from skills-latest-prev (skills-latest unavailable). Investigate."
          else
            echo "::error::Neither skills-latest nor skills-latest-prev release asset is available."
            echo "::error::Run daily-scrape.yml manually to produce one, or restore via scripts/migrate-raw-to-ndjson.js."
            exit 1
          fi

      # plugins-empty-deploy fix (B1): Push-event branch fetches
      # plugins.ndjson + mcp-servers.ndjson from the `plugins-latest` release
      # asset — mirrors the skills fetch above. Graceful fallback (echo +
      # continue) when the asset doesn't exist yet: it won't until the first
      # post-fix scheduled/dispatch run publishes plugins-latest. The build's
      # plugin/MCP page loaders degrade to "no records" if the files are
      # absent (same as a Track-1-only day), so a missing asset on the FIRST
      # push after this fix is non-fatal — it just means that push rebuilds
      # without plugin data until the next scheduled run publishes it.
      - name: Fetch plugins-latest release asset (push-event path)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          if gh release download plugins-latest --pattern 'plugins.ndjson' --output data/plugins.ndjson 2>/dev/null \
             && gh release download plugins-latest --pattern 'mcp-servers.ndjson' --output data/mcp-servers.ndjson 2>/dev/null; then
            echo "Fetched plugins.ndjson ($(wc -l < data/plugins.ndjson) records) and mcp-servers.ndjson ($(wc -l < data/mcp-servers.ndjson) records) from plugins-latest"
          else
            echo "::warning::plugins-latest release asset unavailable (expected before the first post-fix scheduled run). Building without plugin/MCP data this push."
          fi

      # Phase 4.2 (D-07): push-event fetch of apis-latest. NOT flag-gated (the asset simply
      # does not exist until DATA_FEEDS is on for main); non-fatal either way.
      - name: Fetch apis-latest release asset (push-event path)
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          if gh release download apis-latest --pattern 'apis.ndjson' --output data/apis.ndjson 2>/dev/null; then
            echo "Fetched apis.ndjson ($(wc -l < data/apis.ndjson) records) from apis-latest"
          else
            echo "::notice::apis-latest release asset unavailable (DATA_FEEDS not yet enabled on main). Building without api data this push."
          fi

      # T5 5e (Rev 2 B4): Regression guard. Rewritten from `JSON.parse(
      # readFileSync('data/skills.json'))` to `wc -l < data/skills.ndjson`.
      # The old form crashed at V8's 0x1fffffe8 string limit once
      # skills.ndjson grew past 537 MB (~50k records); wc -l streams.
      - name: Check skills count
        run: |
          CURRENT=$(wc -l < data/skills.ndjson)
          echo "Current skills count: $CURRENT"
          if [ "$CURRENT" -lt 100 ]; then
            echo "::error::Skills count too low: $CURRENT (minimum 100)"
            exit 1
          fi

      # Build site (PostHog key baked into client bundle if configured)
      # Phase 3.2.1: log tee'd for the compute-similar engine/timing gate below
      # (pipefail BEFORE the pipe — GitHub's bash -e default does not include it).
      - name: Build Astro site
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}

      # Phase 3.2.1: same anti-silent-fallback + timing gate for the prebuild
      # compute-similar pass (the historical ~162-min Build long-pole). Non-push
      # only: push-event builds run on the stale 1,078-vector seed where timings
      # are trivially fine — keep the gate scoped to data runs.
      - name: "Gate: compute-similar engine + timing"
        if: github.event_name != 'push'
        run: |
          grep -q '\[ann\] engine=hnsw' /tmp/build.log || { echo '::error::ANN engine gate FAILED — compute-similar (prebuild) ran on the exact fallback engine.'; exit 1; }
          ELAPSED=$(grep -o 'similar-skill sets in [0-9.]*s' /tmp/build.log | grep -o '[0-9.]*s' | grep -o '[0-9.]*' | head -1)
          [ -n "$ELAPSED" ] || { echo '::error::compute-similar timing gate FAILED — could not parse elapsed seconds from /tmp/build.log (log-line contract broken?)'; exit 1; }
          echo "compute-similar elapsed: ${ELAPSED}s (gate: <900)"
          awk -v e="$ELAPSED" 'BEGIN { exit (e+0 < 900) ? 0 : 1 }' || { echo "::error::compute-similar timing gate FAILED: ${ELAPSED}s >= 900s (15 min)"; exit 1; }

      # Deploy to Cloudflare Workers Static Assets
      # Branch dispatch safety (Phase 3.1): deploys to claudeatlas.com.
      # Main-only — branch runs build but stop before deploy.
      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
          # Phase 3.1.x: explicitly request wrangler 4.x. The action's
          # default is 3.90.0, which (a) silently ignores `run_worker_first`
          # in wrangler.toml's [assets] block (F1 added that field for
          # tier-aware Listed-tier KV rendering), and (b) overrides the
          # package.json devDependency pin via its own `npm i wrangler@<v>`
          # step. Without this override, run_worker_first is a no-op and
          # Listed-tier slugs serve the 404 page instead of routing
          # through the worker.
          wranglerVersion: '4'

      # Health check
      - name: Health check
        if: github.ref == 'refs/heads/main'
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://claudeatlas.com || echo "000")
          echo "Site returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Site health check returned HTTP $STATUS (may still be deploying)"
          fi

      # Commit updated data back to repo (scheduled + manual runs only).
      # Push-triggered runs have nothing to commit since scrape/filter were skipped.
      #
      # T5 5e: skills.ndjson is NOT committed (distributed via skills-latest
      # release asset instead — see "Publish skills-latest release asset"
      # above). The committed set narrowed to:
      #   - data/pipeline-stats.json: bounded summary; useful in git diff.
      #   - data/history/: daily snapshots, ~225 KB/day; compound time series.
      #   - data/snapshots/: daily catalog composition (~few KB/day; tier /
      #     entity-type / category counts) — quick-260804-d5p; compounding
      #     substrate for the /trends page + AEO trend consumers.
      #   - data/kv-published.json: slug→sha sidecar (~4 MB at 50k slugs;
      #     bounded by catalog size). publish-kv.js skips records whose
      #     sidecar entry matches — committing this lets cron resume
      #     incrementally across runs without re-uploading every record.
      - name: Commit skills data
        # Branch dispatch safety (Phase 3.1): would push data files to
        # the dispatched branch. Harmless but noisy; main-only.
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "ClaudeAtlas Bot"
          git config user.email "bot@claudeatlas.com"
          git add data/pipeline-stats.json data/history/ data/kv-published.json data/badge-star-history.json data/snapshots/ data/traffic-snapshot.json || true
          git diff --cached --quiet || git commit -m "chore: update skills data $(date -u +%Y-%m-%d)"
          # Fail loud on push errors. The prior `|| true` silently masked
          # permission failures for 5+ weeks — never again.
          git push

  # quick-260804-dy2 (FIX B): surface a failed daily-scrape instead of it
  # going silent. Runs ONLY when scrape-build-deploy fails, so the SUCCESS
  # PATH IS COMPLETELY UNAFFECTED (the whole job + every step is skipped on
  # success via `if: failure()`). Opens/comments a deduped GitHub Issue
  # (label cron-failure) and optionally POSTs a webhook.
  notify-on-failure:
    needs: scrape-build-deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # Outage 2026-10: 39 daily comments on issue #18 carried only a date +
      # run URL. actions:read lets the notify step look up the FAILING STEP
      # NAME via the jobs API and put it in the issue title/body.
      actions: read
    steps:
      # (2) OPTIONAL push first. NO step-level `if:` — the `secrets` context
      # is INVALID in a step `if:` and would invalidate the WHOLE workflow
      # file (GitHub rejects it at validation time → no jobs run, incl. the
      # success path). Instead: continue-on-error so a broken/absent webhook
      # can never mask the real failure or block the issue step, pass the
      # secret via env:, and guard on emptiness INSIDE the run: script (a
      # step's own env is also not available to its own if:, so the in-script
      # check is the pattern).
      - name: Push webhook alert (optional)
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$ALERT_WEBHOOK_URL" ] || { echo "no webhook configured; skipping"; exit 0; }
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"content\": \"ClaudeAtlas daily-scrape FAILED — $RUN_URL\"}" \
            "$ALERT_WEBHOOK_URL" || true

      # (1) Zero-setup fallback: deduped GitHub Issue via gh/GITHUB_TOKEN.
      - name: Open or update cron-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Ensure the label exists (idempotent). Must pass --repo: the notify job
          # has no checkout, so gh cannot infer the repo from a git remote, and
          # without it `gh label create` fails silently (|| true) — then the
          # subsequent `gh issue create --label cron-failure` hard-fails with
          # "label not found". --force makes it create-or-update idempotent.
          # (Root-caused from run 30933629884, 2026-08-04.)
          gh label create cron-failure --repo "$REPO" --force --color B60205 \
            --description "Automated daily-scrape failure" 2>/dev/null || true
          DATE=$(date -u +%Y-%m-%d)
          # Name the failing step (outage 2026-10: the issue said nothing about
          # WHICH of 40 steps failed, so three different root causes read as
          # one undifferentiated "failed" for 39 days). Best-effort: falls
          # back to "unknown" rather than failing the notification.
          FAILED_STEP=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.conclusion=="failure" or .conclusion=="cancelled") | .steps[] | select(.conclusion=="failure" or .conclusion=="cancelled") | .name] | first // "unknown"' \
            2>/dev/null || echo "unknown")
          echo "failing step: ${FAILED_STEP}"
          BODY="daily-scrape run failed on ${DATE} (UTC).\n\n**Failed step:** ${FAILED_STEP}\n\nFailed run: ${RUN_URL}\n\nRunbook: CLAUDE.md → \"Recovery: expired GitHub PAT / poisoned GHA caches\" (token/cache failures) or \"Recovery: F1 deploy broken\" (build/deploy failures)."
          EXISTING=$(gh issue list --repo "$REPO" --label cron-failure \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            printf '%b' "New failure: ${DATE} — step: **${FAILED_STEP}**\n\n${RUN_URL}" \
              | gh issue comment "$EXISTING" --repo "$REPO" --body-file -
            # Keep the TITLE current so the sidebar/notification shows the
            # latest date + step instead of the first failure's date.
            gh issue edit "$EXISTING" --repo "$REPO" \
              --title "daily-scrape failing — latest ${DATE} at step: ${FAILED_STEP}" 2>/dev/null || true
            echo "Commented existing cron-failure issue #$EXISTING"
          else
            printf '%b' "$BODY" \
              | gh issue create --repo "$REPO" --label cron-failure \
                --title "daily-scrape failing — latest ${DATE} at step: ${FAILED_STEP}" --body-file -
            echo "Created new cron-failure issue"
          fi
