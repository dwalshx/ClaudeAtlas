name: Daily Scrape & Deploy

on:
  schedule:
    - cron: '30 6 * * *' # 6:30 AM UTC daily
  workflow_dispatch: {} # Manual trigger
  push:
    branches: [main]

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    # Daily target: <30 min warm. 90-min cap is safety net; if hit,
    # something is wrong. Pipeline is split into Track 1 (Star Pulse,
    # cheap refresh of known repos) followed by Track 2 (Discovery,
    # incremental — only new/changed skills). Push-triggered runs skip
    # both scrape steps entirely so they're typically under 90 seconds.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # --- Data pipeline (scheduled + manual runs only) ---
      # Push events skip the scrape+filter+cache steps and deploy the
      # committed data/skills.json as-is. This makes code deploys fast
      # (~90 sec) and avoids the cold-scrape timeout problem on first
      # runs without an ETag cache.

      # Restore ETag cache from previous run.
      # Split from save step so that save can run with `if: always()`
      # after the scrape — even if the scrape times out or is cancelled,
      # the partially-built cache (scraper checkpoints every 1000 skills
      # via saveETagCache()) gets persisted for the next run.
      - name: Restore ETag cache
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: data/etag-cache.json
          key: etag-cache-${{ github.run_number }}
          restore-keys: etag-cache-

      # Track 1: Star Pulse — cheap refresh of stars/forks/issues/pushed_at
      # for already-known repos. Conditional GETs via ETag cache make this
      # near-free for unchanged repos.
      - name: Run Track 1 (Star Pulse)
        if: github.event_name != 'push'
        run: npm run scrape:pulse
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPE_PAT }}

      # Track 2: Discovery (incremental) — find new/changed SKILL.md files
      # since last run. Writes skills-raw.json. Full discovery is gated
      # behind a separate workflow/script for periodic deep sweeps.
      - name: Run Track 2 (Discovery, incremental)
        if: github.event_name != 'push'
        run: npm run scrape:discover:incremental
        env:
          GITHUB_TOKEN: ${{ secrets.SCRAPE_PAT }}

      # Save ETag cache even on timeout/failure/cancel. This is the
      # critical fix: actions/cache@v4's implicit post-job save is
      # skipped when the job is cancelled (e.g. timeout), which caused
      # every scheduled run to be a cold scrape. With `if: always()`
      # and a bounded condition, the cache persists regardless of the
      # scrape step's outcome so subsequent runs start warm.
      - name: Save ETag cache
        if: always() && github.event_name != 'push' && hashFiles('data/etag-cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/etag-cache.json
          key: etag-cache-${{ github.run_number }}

      # Apply filter (writes skills.json from skills-raw.json)
      - name: Filter and calibrate skills
        if: github.event_name != 'push'
        run: npm run filter

      # --- Semantic search: embed new/changed skills, upload to Vectorize ---
      # Embed step is resumable and idempotent: reads prior ndjson, only embeds
      # deltas. Safe to run on every workflow event. Upload step upserts into
      # the Vectorize index; matching ids are replaced.
      - name: Embed skills (OpenAI)
        run: npm run embed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload vectors to Vectorize
        run: npm run upload-vectors
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # Regression guard
      - name: Check skills count
        run: |
          CURRENT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/skills.json','utf8')).length)")
          echo "Current skills count: $CURRENT"
          if [ "$CURRENT" -lt 100 ]; then
            echo "::error::Skills count too low: $CURRENT (minimum 100)"
            exit 1
          fi

      # Build site (PostHog key baked into client bundle if configured)
      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}

      # Deploy to Cloudflare Workers Static Assets
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      # Health check
      - name: Health check
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://claudeatlas.com || echo "000")
          echo "Site returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Site health check returned HTTP $STATUS (may still be deploying)"
          fi

      # Commit updated data back to repo (scheduled + manual runs only).
      # Push-triggered runs have nothing to commit since scrape/filter were skipped.
      - name: Commit skills data
        if: github.event_name != 'push'
        run: |
          git config user.name "ClaudeAtlas Bot"
          git config user.email "bot@claudeatlas.com"
          git add data/skills.json data/pipeline-stats.json data/history/ || true
          git diff --cached --quiet || git commit -m "chore: update skills data $(date -u +%Y-%m-%d)"
          git push || true
