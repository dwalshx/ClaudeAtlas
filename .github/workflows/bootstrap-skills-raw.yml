name: Bootstrap skills-raw cache (one-shot)

# One-time (and disaster-recovery) workflow to seed the GitHub Actions cache
# with the local ~295 MB data/skills-raw.json file. Phase 3.0.1 splits the
# scrape into Track 1 (history) and Track 2 (discover). Track 2's discover
# step needs skills-raw.json present at the start of every CI run to merge
# new SKILL.md hits into. Without this seed, every scheduled run starts
# cold with no corpus to merge into and the daily pipeline can't follow R3
# merge semantics.
#
# Mirrors bootstrap-etag-cache.yml (the proven Phase 3.0.0 bootstrap
# pattern).
#
# How it works:
#   1. Downloads data/skills-raw.json from the `skills-raw-bootstrap`
#      release asset.
#   2. Saves it to GHA cache with a key that the daily/weekly workflows'
#      restore-keys: "skills-raw-" prefix-match will pick up.
#   3. Next scheduled daily-scrape run finds the cache and starts warm.
#
# Operator action: Run ONCE via workflow_dispatch from the Actions tab
# after creating the `skills-raw-bootstrap` release with skills-raw.json
# as an asset. KEEP THE RELEASE — do NOT delete it (R5 mitigation; serves
# as permanent disaster-recovery fallback).
#
# If the GHA cache ever evicts (7-day inactivity) or corrupts, re-trigger
# this workflow via workflow_dispatch to re-seed.

on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download skills-raw from release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download skills-raw-bootstrap \
            --pattern 'skills-raw.json' \
            --output data/skills-raw.json
          ls -lh data/skills-raw.json
          echo "SHA256:"
          sha256sum data/skills-raw.json
          echo "Skill count:"
          node -e "const a=JSON.parse(require('fs').readFileSync('data/skills-raw.json','utf8')); console.log('records:',a.length)"

      # FLAG #2: cache-key prefix discipline. Key prefix MUST stay `skills-raw-`
      # to match daily/weekly restore-keys. daily-scrape.yml and
      # weekly-discover.yml use `restore-keys: skills-raw-` (prefix-match), so
      # they will pick this entry up on next run. Do NOT change the prefix
      # without updating BOTH consumer workflows in lockstep (Tasks 6 + 7).
      - name: Save to GitHub Actions cache
        uses: actions/cache/save@v4
        with:
          path: data/skills-raw.json
          key: skills-raw-bootstrap-${{ github.run_number }}

      - name: Confirm cache was saved
        run: |
          echo "Cache saved with key: skills-raw-bootstrap-${{ github.run_number }}"
          echo ""
          echo "daily-scrape.yml and weekly-discover.yml use restore-keys: 'skills-raw-'"
          echo "(prefix match), so they will pick up this entry on next run."
          echo ""
          echo "Next steps for Dan:"
          echo "  1. Verify cache exists: 'gh cache list --limit 5'"
          echo "  2. Trigger a manual daily-scrape run to confirm it goes warm:"
          echo "     gh workflow run daily-scrape.yml"
          echo "  3. KEEP the release 'skills-raw-bootstrap' in place (R5 — do not delete)."
          echo "     If GHA cache ever evicts/corrupts, re-run THIS workflow to re-seed."
