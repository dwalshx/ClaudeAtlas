name: Lint pipeline

# F1 streaming-foundation gate. Runs banned-pattern lint + data-file size
# check + node --test for the scripts/lib helpers on every PR and main push.
#
# Required status checks (configure in branch protection):
#   - lint
#   - size
#   - test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Banned patterns (lint mode against baseline)
        run: node scripts/check-banned-patterns.js --mode=lint
      # F2 (T10): legacy v1 skill-shape lint. Runs in WARNING mode during the
      # cutover window (D+0 through D+6). Flips to --mode=error in the D+7
      # cutover PR per .planning/phases/03.1.2-polymorphic-envelope/3.1.2-CUTOVER.md.
      - name: Legacy v1 skill-shape guard (warning mode during F2 cutover)
        run: node scripts/lint-no-legacy-skill-shape.js --mode=warning

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Data file size guard
        run: node scripts/check-skills-size.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        # --ignore-scripts would skip hnswlib-node's node-gyp compile,
        # silently downgrading ann tests to the exact engine. Compile adds
        # ~30-90 s (gcc preinstalled on ubuntu-latest).
        run: npm ci
      - name: Full test suite (real hnsw engine required)
        # ANN_REQUIRE_HNSW=1 makes the ann parity test FAIL (not skip) if
        # the native build ever breaks on a runner-image/Node bump — the
        # PR-time half of the anti-silent-fallback defense (cron half: Plan 05).
        run: npm test
        env:
          ANN_REQUIRE_HNSW: '1'
