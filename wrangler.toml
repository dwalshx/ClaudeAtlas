name = "claudeatlas"
compatibility_date = "2026-04-10"

# Worker entry point — handles /api/log-search and falls through to ASSETS
# for all other requests. The ASSETS binding is provided automatically by
# the [assets] block below.
main = "worker/log-search.js"

[assets]
directory = "./dist"
not_found_handling = "404-page"
binding = "ASSETS"

# --- Phase 5 Analytics: D1 search query log ---
# Database provisioned via Cloudflare dashboard (Windows ARM64 can't run
# wrangler locally because workerd has no win32-arm64 binary). The CI
# deploy path via cloudflare/wrangler-action@v3 runs on linux-x64 where
# this binding is wired up automatically on every deploy.
#
# SALT_SECRET is set directly on the Worker via the CF dashboard
# (Workers & Pages → claudeatlas → Settings → Variables and Secrets).

[[d1_databases]]
binding = "DB"
database_name = "claudeatlas-search-log"
database_id = "d4e341fa-17d6-4069-8a00-3b6a8d698ab9"
