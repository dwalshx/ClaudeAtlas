name = "claudeatlas"
compatibility_date = "2026-04-10"

# Worker entry point — handles /api/log-search, /api/v1/search, and falls
# through to ASSETS for everything else. The ASSETS binding is provided
# automatically by the [assets] block below.
main = "worker/index.js"

[assets]
directory = "./dist"
not_found_handling = "404-page"
binding = "ASSETS"
# T5 5d follow-up: for /skills/* requests the worker MUST run before the
# assets binding can serve a 404 page. Without this, `not_found_handling
# = "404-page"` causes env.ASSETS.fetch() to return Astro's 404.html
# with status 200, which the worker's "serve static if 200" check
# matches — Listed-tier slugs never reach the KV fallback. With
# `run_worker_first` matching /skills/*, the worker is invoked
# unconditionally for those paths and delegates to assets via
# env.ASSETS.fetch() only when appropriate (Top/Solid tier).
#
# Phase 3.1.x extension: /api/* needs the same treatment for a different
# reason. `not_found_handling = "404-page"` intercepts requests to non-
# existent static assets BEFORE falling through to the worker. /api/v1/
# search and /api/log-search aren't static assets — they're dynamic
# worker routes — so they need run_worker_first to bypass the asset
# binding entirely. This was a silent regression since F1 shipped
# (2026-05-25): /api/v1/search returned Astro's 404 HTML for 2 days
# but didn't surface until Phase 3.1.x wired the homepage search bar
# to it.
#
# quick-260806-dn3 (E1) extension: flipped from the path array
# (["/skills/*", "/api/*", "/badge/*"]) to `true`. E1's request logging
# needs the worker to see ALL traffic — with the array, static-asset
# requests bypassed the worker entirely and never reached the logger.
# The env.ASSETS.fetch fallthrough at the end of handleFetch still
# serves every static path, so behavior is unchanged; cost is ~3M
# invocations/mo, within the Workers Paid 10M included. Rollback =
# restore the array above.
run_worker_first = true

# --- D1: search query log ---
# Provisioned via Cloudflare dashboard. SALT_SECRET set as a Worker secret.
[[d1_databases]]
binding = "DB"
database_name = "claudeatlas-search-log"
database_id = "d4e341fa-17d6-4069-8a00-3b6a8d698ab9"

# --- Vectorize: semantic search over skill embeddings ---
# Index provisioned via REST API call (Windows ARM64 can't run wrangler).
# Dimensions: 1536 (text-embedding-3-small default).
# Metric: cosine (best for text similarity).
# Populated by scripts/embed-skills.js + scripts/upload-vectors.js in CI.
# OPENAI_API_KEY set as a Worker secret for query-time embedding.
[[vectorize]]
binding = "VECTORIZE"
index_name = "claudeatlas-skills"

# --- KV: query embedding cache (Phase 2.2) ---
# Caches OpenAI query embeddings to skip the ~1.1s round trip on repeat
# queries. TTL = 24 hours. Free KV tier: 100k reads/day, 1k writes/day.
#
# To activate:
#   1. Create the namespace in CF dashboard → Workers & Pages → KV →
#      "Create a namespace" → name: "claudeatlas-query-cache"
#   2. Copy the namespace ID and paste it below, then uncomment
#   3. Push to deploy (or wrangler deploy in CI)
#
# Without this binding, the Worker falls back to calling OpenAI for every
# query (~1.5s total). With it, repeat queries drop to ~500ms.
#
# ⚠️ PARTIALLY ACTIVATED 2026-04-18 — binding uncommented but `id` is a
# placeholder. Before `wrangler deploy`, run:
#     wrangler kv:namespace create QUERY_CACHE
# and paste the returned id into the line below. See MORNING-CHECKLIST.md.
[[kv_namespaces]]
binding = "QUERY_CACHE"
id = "bb975b4a7dcd4426bcead6579f636cc3"

# --- KV: per-slug skill records (Phase 03.1.1 T5d / Decision A) ---
# After T5's tier-aware rendering, only Top/Featured + Solid slugs get a
# static HTML file in dist/. Listed slugs are served at request time by
# worker/index.js via env.SKILLS_KV.get(slug). The worker reads ONE record
# per request (O(1) per-request memory in catalog size) — no NDJSON
# materialization in the Worker.
#
# Free KV tier: 100k reads/day, 1k writes/day. The KV_PUBLISH_BUDGET env
# var on the daily-scrape publish:kv step caps writes per run; first-
# bootstrap publish shards across ~5 days at 10k writes/run. See
# scripts/lib/publish-kv.js and CLAUDE.md "Embedding cost controls"
# for cost analysis.
#
# Namespace created 2026-05-18 via Cloudflare dashboard. GitHub Actions
# secret SKILLS_KV_NAMESPACE_ID points at the same ID for publish:kv.
[[kv_namespaces]]
binding = "SKILLS_KV"
id = "a27c6e00fc65418a9bb6a1fcb9c0d2eb"
